name: Generate market podcast

on:
  schedule:
    # Horários de São Paulo em minutos fora do pico do GitHub Actions.
    # A primeira execução é a principal; as demais recuperam falhas sem duplicar.
    - cron: "47 7 * * 1-5"
      timezone: "America/Sao_Paulo"
    - cron: "7,27,47 8-9 * * 1-5"
      timezone: "America/Sao_Paulo"
    - cron: "17 18 * * 1-5"
      timezone: "America/Sao_Paulo"
    - cron: "37,57 18 * * 1-5"
      timezone: "America/Sao_Paulo"
    - cron: "17,37,57 19-20 * * 1-5"
      timezone: "America/Sao_Paulo"
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      edition:
        description: Edição a gerar
        required: true
        type: choice
        options:
          - abertura
          - fechamento

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: market-podcast
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner &&
       (github.event.issue.title == '[scheduler] abertura' ||
        github.event.issue.title == '[scheduler] fechamento' ||
        github.event.issue.title == '[scheduler] teste abertura' ||
        github.event.issue.title == '[scheduler] teste fechamento'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select edition
        id: edition
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_EDITION: ${{ inputs.edition }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          EDITION="$(python3 workflow_logic.py select)"
          FORCE_REGENERATE="$(python3 workflow_logic.py force)"
          echo "value=$EDITION" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE_REGENERATE" >> "$GITHUB_OUTPUT"
          echo "Edição selecionada: $EDITION; regeneração forçada: $FORCE_REGENERATE."

      - name: Check publication completeness
        id: needed
        shell: bash
        env:
          EDITION: ${{ steps.edition.outputs.value }}
          FORCE_REGENERATE: ${{ steps.edition.outputs.force }}
        run: |
          EPISODE_DATE="$(TZ=America/Sao_Paulo date +%F)"
          COMPLETE="$(python3 workflow_logic.py complete --root . --date "$EPISODE_DATE" --edition "$EDITION")"
          if [ "$FORCE_REGENERATE" = "true" ] || [ "$COMPLETE" != "true" ]; then
            echo "Episódio ausente ou incompleto; iniciando geração de $EDITION."
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "Episódio completo e presente no RSS; nenhuma duplicidade será criada."
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$EPISODE_DATE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.needed.outputs.value == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Run publication gate tests
        if: steps.needed.outputs.value == 'true'
        run: python -m unittest -v

      - name: Install dependencies
        if: steps.needed.outputs.value == 'true'
        run: pip install -r requirements.txt

      - name: Generate researched editorial episode
        if: steps.needed.outputs.value == 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
        run: python generate.py --edition "${{ steps.edition.outputs.value }}" 2>&1 | tee generation.log

      - name: Upload failure diagnostics
        if: steps.needed.outputs.value == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-failure-${{ steps.edition.outputs.value }}-${{ github.run_id }}
          path: generation.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit episode
        if: steps.needed.outputs.value == 'true' && success()
        shell: bash
        run: |
          git config user.name "market-podcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "A geração não produziu arquivos publicáveis."
            exit 1
          fi
          git commit -m "publish ${{ steps.edition.outputs.value }} $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
        if: steps.needed.outputs.value == 'true' && success()

      - uses: actions/upload-pages-artifact@v3
        if: steps.needed.outputs.value == 'true' && success()
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        if: steps.needed.outputs.value == 'true' && success()

      - name: Keep failed scheduler signal open
        if: github.event_name == 'issues' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "${{ github.event.issue.number }}" \
            --body "A geração falhou e este sinal foi mantido aberto. Diagnóstico: ${RUN_URL}"

      - name: Close successful scheduler signal
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --reason completed \
            --comment "Episódio verificado pelo workflow. Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Market Brief Brasil"
            echo "- Edição: ${{ steps.edition.outputs.value }}"
            echo "- Data de São Paulo: ${{ steps.needed.outputs.date }}"
            echo "- Geração necessária: ${{ steps.needed.outputs.value }}"
            echo "- Resultado do job: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
